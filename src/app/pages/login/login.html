<div class="login-wrap">
  <div class="login-card">
    <a class="logobox" routerLink="/apropos"><img [src]="logo" alt="SITS"/></a>
    <p class="sub">Espace administration</p>

    <label>Email</label>
    <input class="input" type="email" [(ngModel)]="email" placeholder="email@exemple.com" autocomplete="email"/>

    <label>Mot de passe</label>
    <div class="pwd-wrap">
      <input class="input pwd-input" [type]="showPwd ? 'text' : 'password'" [(ngModel)]="password"
             (keyup.enter)="submit()" placeholder="••••••••" autocomplete="current-password"/>
      <button type="button" class="eye-btn" (click)="showPwd=!showPwd" tabindex="-1">
        {{ showPwd ? '🙈' : '👁' }}
      </button>
    </div>

    @if (error()) { <div class="err">{{ error() }}</div> }

    <button class="btn btn-ink full" [disabled]="loading()" (click)="submit()">
      {{ loading() ? 'Connexion...' : 'Se connecter' }}
    </button>

    <a class="vitrine-lien" routerLink="/vitrine">Voir les logements disponibles →</a>
  </div>
</div>
