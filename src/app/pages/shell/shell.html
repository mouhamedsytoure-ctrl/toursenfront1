<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar" [class.open]="open()">
    <a class="brandbox" routerLink="/accueil" title="Accueil">
      @if (logo(); as l) {
        <img [src]="l" alt="{{ agenceNom() }}"/>
      } @else {
        <span class="brand-pictogram">🏢</span>
      }
    </a>
    <nav>
      @for (m of visibleMenu(); track m.path) {
        <a [routerLink]="m.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: m.path === '/app' }" (click)="open.set(false)">
          <span class="ic">{{ m.icon }}</span> {{ m.label }}
          @if (m.proOnly && !estProOuPlus()) { <span class="badge-pro">Pro</span> }
        </a>
      }
    </nav>
    <div class="userbox">
      <div class="uname">{{ auth.user()?.name }}</div>
      <div class="urole">{{ roleLabel() }}</div>
      <button class="btn btn-gold full" (click)="logout()">Déconnexion</button>
    </div>
  </aside>

  <!-- Zone principale -->
  <div class="main">
    <header class="topbar">
      <button class="burger" (click)="open.set(!open())">☰</button>
      <span class="ttl">{{ agenceNom() }}</span>
    </header>
    @if (bandeau(); as b) {
      <div class="bandeau" [class.urgent]="b.urgent">
        <span>{{ b.texte }}</span>
        <a routerLink="/abonnement">Voir les formules →</a>
      </div>
    }
    <div class="page">
      <router-outlet></router-outlet>
    </div>
  </div>

  @if (open()) { <div class="overlay" (click)="open.set(false)"></div> }
</div>
